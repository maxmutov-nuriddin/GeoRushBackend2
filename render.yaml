services:
  - type: web
    name: georush-backend
    env: node
    # ⚠️ `npx prisma db push` bu yerdan ATAYLAB olib tashlangan (2026-07-02):
    # u schema.prisma'da bo'lmagan jadval/ustun/indekslarni bazadan O'CHIRADI —
    # TrafficCell (piyoda trafik) ma'lumoti shu sabab deploy'da yo'qolgan edi.
    # Jadval/ustunlar server boot'ida ensureCoreTables() (src/config/database.js)
    # orqali idempotent yaratiladi — db push umuman kerak emas.
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: georush-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: georush-db
    databaseName: georush
    user: georush
    plan: free # Change to standard/pro later
    region: frankfurt
