version: '3.8'

# ⚠️ DIQQAT: bu fayldagi JWT_SECRET va parollar FAQAT lokal dev uchun.
# Production'da ishlatilmaydi — prod deploy `render.yaml` orqali, maxfiy qiymatlar
# Render env / secret manager'da turadi va bu faylga KO'CHMASLIGI kerak.

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://georush:password@postgres:5432/georush_db?schema=public
      - JWT_SECRET=testsecret_georush
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.3-alpine
    environment:
      - POSTGRES_USER=georush
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=georush_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # PgBouncer (Connection Pooler for max CCU)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=georush
      - DB_PASSWORD=password
      - DB_HOST=postgres
      - DB_NAME=georush_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=100
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
